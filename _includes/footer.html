{%- assign mail = site.data.links | where_exp: "l", "l.emails" | first -%}
<footer class="site-foot"><span>Last updated {{ site.time | date: "%B %Y" }}. </span><span><a href="{{ site.cv | relative_url }}">CV</a>, <a href="https://scholar.google.com/citations?user=19m6XE4AAAAJ">Google Scholar</a>{% if mail %}. Email: {% for e in mail.emails %}<a href="mailto:{{ e.address }}">{{ e.address }}</a>{% unless forloop.last %} or {% endunless %}{% endfor %}{% endif %}</span></footer>
