{%- comment -%} The colour switch: warm (the default), Science, Tufte. Wired up by assets/js/theme.js; dot colours in assets/css/art.css. {%- endcomment -%}
<div class="tsw" role="group" aria-label="Color theme"><i class="fa-solid fa-palette" aria-hidden="true"></i><button type="button" data-theme-pick="warm" title="Warm (default)" aria-label="Warm colors, the default" aria-pressed="true"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.6" fill="currentColor"/></svg></button><button type="button" data-theme-pick="science" title="Science" aria-label="Science colors" aria-pressed="false"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.6" fill="currentColor"/></svg></button><button type="button" data-theme-pick="tufte" title="Tufte" aria-label="Tufte colors" aria-pressed="false"><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.6" fill="currentColor"/></svg></button></div>
