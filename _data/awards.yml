# Awards panel (_includes/panels/awards.html). Edit text here; the panel only lays it out.
#   times: shown as a ×N badge when an award was received more than once

intro: 'Honors, fellowships, and travel awards since 2022, for research, teaching, and service.'

# The three headline honors, shown as cards. style: gold for the best-paper award, plain otherwise.
#   icon: a symbol id from _includes/icons.html
highlights:
  - name: Best Paper Runner-Up
    where: L4DC 2026
    year: 2026
    style: gold
    icon: g-star
    line: 'One of two papers recognized at the conference, for [Flickering Multi-Armed Bandits](#t-graphs), which was also selected for an oral talk.'
  - name: Ralph J. Slutz Student Excellence Award
    where: CU Boulder
    year: 2026
    icon: g-medal
    line: 'For academic excellence, research, and innovation.'
  - name: Lloyd Botway Award
    where: CU Boulder
    year: 2022
    icon: g-medal
    line: 'The highest honor for a graduating master''s student, recognizing academics, teaching, research, and service.'

