# Talks panel (_includes/panels/talks.html): research talks, newest first.
# Lectures from teaching live in _includes/panels/teaching.html.
#   title:   card title
#   where:   venue line(s) under the title
#   paper:   id from _data/papers.yml; adds a Paper link and shows that paper's drawn thumbnail
#   slides:  PDF path (files live in /files/talks/); leave it out and the card says "Slides soon"
#   video:   an .mp4 path, or youtube:VIDEO_ID; leave it out until there is a recording
#   length:  video length shown on the link, e.g. 3 min
#   poster:  still image shown before an .mp4 plays (optional)
#
# Adding a recording later is one line: put `video:` (and `length:`) on the talk.

