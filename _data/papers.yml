- id: kata
  thumb_style: drawn
  theme: fm
  title: 'Kernelized Linear Attention: Breaking the Capacity Wall with Symmetric Cones'
  url: https://arxiv.org/abs/2607.17419
  badges:
  - type: rev
    text: under review
  authors: Ayoub Ghriss, Sourav Chakraborty
  tldr: Associative recall in linear attention as a sphere-packing problem, with feature maps over self-dual symmetric cones. Rank-one PSD features enlarge the recurrent state without adding parameters. My part was the mathematics.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2607.17419
- id: multi-agent-lipschitz
  thumb_style: drawn
  theme: cont
  title: Multi-Agent Lipschitz Bandits
  url: https://arxiv.org/abs/2602.16965
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Claire Monteleoni, Lijun Chen
  equal: true
  venue: 29th International Conference on Artificial Intelligence and Statistics, Tangier
  abbr: AISTATS 2026
  tldr: Several players share one continuous action space and cannot communicate. Separating coordination from exploration gives near-optimal regret, with a coordination cost that does not grow with the horizon.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2602.16965
  - label: PDF
    url: https://arxiv.org/pdf/2602.16965
- id: proximity-collisions
  thumb_style: drawn
  theme: cont
  title: Decentralized Lipschitz Bandits with Proximity Collisions
  badges:
  - type: rev
    text: under review
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Lijun Chen
  equal: true
  tldr: 'Agents collide when they come within $\rho$ of each other. ConfigZoom keeps one shared adaptive partition and plays points inside its cells, so placements close to the collision distance stay available; in the worst case its regret matches a centralized lower bound up to log factors.'
  note: arXiv link soon
- id: incentivized-lipschitz
  thumb_style: drawn
  theme: cont
  title: Incentivized Lipschitz Bandits
  url: https://arxiv.org/abs/2508.19466
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Claire Monteleoni, Lijun Chen
  equal: true
  venue: 64th IEEE Conference on Decision and Control, Rio de Janeiro
  abbr: IEEE CDC 2025
  tldr: A principal pays myopic agents to explore a continuous action space, and the payments bias the feedback they report. Uniform-discretization algorithms still get near-optimal regret.
