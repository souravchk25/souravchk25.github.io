# Papers, grouped on the page by theme (in this order within a theme).
#   id:      file name of the thumbnail, _includes/thumbs/<id>.html
#   theme:   one of the ids in _data/themes.yml
#   url:     where the title links; leave out for papers not yet public
#   badges:  type is bp (best paper), oral, or rev (under review); text is what the badge says
#   authors: plain text; your name is highlighted automatically. equal: true adds "*equal contribution"
#   venue, abbr: full venue name and the short tag, e.g. "L4DC 2026"
#   thumb_style: drawn for thumbnails drawn by assets/js/paper-thumbs.js (no tinted box behind them)
#   tldr:    one or two sentences
#   links:   label and url for each button; note: grey text after the links, e.g. "arXiv link soon"

- id: fmab
  thumb_style: drawn
  theme: graphs
  title: Flickering Multi-Armed Bandits
  url: https://arxiv.org/abs/2602.17315
  badges:
  - type: bp
    text: Best Paper Runner-Up
  - type: oral
    text: Oral
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Claire Monteleoni, Lijun Chen
  equal: true
  venue: 8th Annual Learning for Dynamics and Control Conference, Los Angeles
  abbr: L4DC 2026
  tldr: Arms sit on a random graph that rewires every round, and the learner can only step to a neighbor. A two-phase algorithm built on lazy random walks gets near-optimal sublinear regret.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2602.17315
  - label: PDF
    url: https://arxiv.org/pdf/2602.17315
  note: slides and video soon
- id: local-walks
  thumb_style: drawn
  theme: graphs
  title: Learning from Local Walks on Dynamic Graphs with Bandit Feedback
  url: https://arxiv.org/abs/2607.10571
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Claire Monteleoni, Lijun Chen
  equal: true
  venue: 65th IEEE Conference on Decision and Control, Honolulu
  abbr: IEEE CDC 2026
  tldr: The learner walks on a sequence of graphs and sees rewards only where it stands. Under a sliding-window mixing condition, local explore-then-commit algorithms get sublinear expected regret.
  links:
  - label: arXiv
    url: https://arxiv.org/abs/2607.10571
  - label: PDF
    url: files/cdc-graph.pdf
- id: dynamic-graphs-workshop
  thumb_style: drawn
  theme: graphs
  title: Bandit Learning on Dynamic Graphs
  url: https://openreview.net/forum?id=1kSkM0IF7K
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Claire Monteleoni, Lijun Chen
  equal: true
  venue: NeurIPS 2025 Workshop on Aligning Reinforcement Learning Experimentalists and Theorists, San Diego
  abbr: NeurIPS 2025 workshop
  tldr: When can an agent that moves locally on a changing graph learn at all? Sufficient structural conditions for learnability, and near-optimal exploration policies under them.
  links:
  - label: OpenReview
    url: https://openreview.net/forum?id=1kSkM0IF7K
- id: locality-marl
  thumb_style: drawn
  theme: marl
  title: A Unified Framework for Locality in Scalable MARL
  url: https://arxiv.org/abs/2602.16966
  authors: Sourav Chakraborty*, Amit Kiran Rege*, Claire Monteleoni, Lijun Chen
  equal: true
  venue: 8th Annual Learning for Dynamics and Control Conference, Los Angeles
  abbr: L4DC 2026
  tldr: Whether agents can plan with a small neighborhood depends on the policy as well as the environment. A spectral condition, weaker than the usual row-sum test, certifies it, and for softmax policies the temperature controls it.
  links:
