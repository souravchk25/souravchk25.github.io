- id: quantum-nonstationary
  thumb_style: drawn
  theme: quantum
  title: Non-Stationary Quantum Bandits under a Variation Budget
  badges:
  - type: rev
    text: under review
  authors: Jiarui Hu, Sourav Chakraborty, Lijun Chen
  tldr: 'Rewards drift within a variation budget $V_T$. Restarting a stationary quantum learner every $\sqrt{KT/V_T}$ rounds gives dynamic regret $\tilde O(\sqrt{K V_T T})$, below the classical $(K V_T)^{1/3} T^{2/3}$, with a matching lower bound and a variant that learns the window.'
  note: arXiv link soon
- id: quantum-regret-bounds
  thumb_style: drawn
  theme: quantum
  title: On Regret Bounds of Quantum Bandit Algorithms
  badges:
  - type: rev
    text: under review
  authors: Jiarui Hu, Wenzhi Chen, Sourav Chakraborty, Lijun Chen
  tldr: 'Lower bounds of $\Omega(n\sigma\log T)$ for quantum multi-armed bandits and $\Omega(\sigma d\log T)$ for quantum linear bandits, with upper bounds that match for $\sigma = \Omega(1)$: the $\log T$ is the cost of confidence, and keeping quantum memory between stages does not help.'
  note: arXiv link soon
