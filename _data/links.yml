# The row of links under your name. icon is a Font Awesome class
# (https://fontawesome.com/search?ic=brands for brands). url: cv means the CV file set in _config.yml.
# An entry with `emails:` instead of `url:` becomes a menu of addresses.

- label: CV
  url: cv
  icon: fa-regular fa-file-lines
- label: Google Scholar
  url: https://scholar.google.com/citations?user=19m6XE4AAAAJ
  icon: fa-brands fa-google-scholar
- label: LinkedIn
  url: https://www.linkedin.com/in/souravchk/
  icon: fa-brands fa-linkedin
- label: Email
  icon: fa-regular fa-envelope
  # Opens a small menu with both addresses (and copy buttons); the footer lists them too.
  emails:
    - address: mail.souravchk@gmail.com
      note: permanent
    - address: sourav.chakraborty@colorado.edu
      note: university
