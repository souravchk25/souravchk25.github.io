# Role cards. icon: a symbol id from _includes/icons.html
#   courses: code, name, term (optional), students (optional)
roles:
  - title: Instructor of record
    when: 2020 – 2021
    icon: g-chalk
    courses:
      - code: CSCI 1200
        name: Introduction to Computational Thinking
        term: Fall 2021
        students: about 200 students
      - code: CSCI 3022
        name: Introduction to Data Science with Probability and Statistics
        term: Summer 2020
        students: about 50 students
    points:
      - 'Ran each course end to end: lecture planning, teaching, assessments, and final grades.'
      - 'Coordinated the instructional staff for each course.'

  - title: Department Lead TA
    when: 2022 – 2025
    icon: g-team
    points:
      - 'Selected through a teaching review and interviews, and reappointed for three consecutive years.'
      - 'Ran TA hiring interviews and the annual onboarding for **280+** TAs, graders, and instructional staff.'
