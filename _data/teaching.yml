# Lectures, newest first. Adding one later is one entry here.
#   art:     drawing in _includes/lectures/<art>.html (optional; falls back to the chalkboard icon)
#   slides:  PDF in /files/talks/ ; leave it out and the card says "Slides soon"
#   pages:   slide count shown on the card (optional)
#   video:   an .mp4 path or youtube:VIDEO_ID, with length: (optional)
lectures:
  - title: 'Graphs: what''s left when you keep only the connections'
    course: CSCI 2270 Data Structures
    when: Fall 2026
    kind: Lecture
    art: house
    slides: /files/talks/graphs-csci2270-2026.pdf
    pages: 26
    blurb: 'Opens with a puzzle (draw this house in one stroke) and Euler''s bridges of Königsberg, asks whether a slime mold can design Tokyo''s rail network, then builds the vocabulary and the two ways to store a graph, adjacency matrix and list, in C++. Ends on Six Degrees of Wikipedia.'

  - title: Bandit models
    course: Advanced Machine Learning
    when: Fall 2023
    kind: Guest lecture
    art: bandits
    blurb: 'The explore–exploit trade-off and the multi-armed bandit model, for a graduate machine learning course.'
